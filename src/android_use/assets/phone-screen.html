<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Use · 手机屏幕</title><style>:root {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: light dark;
  color: #363638;
  background: #fafafa;
  --foreground: #363638;
  --muted: #929294;
  --line: #e6e6e8;
  --surface: #fff;
  --hover: #f0f0f2;
  --live: #39a76c;
}
* { box-sizing: border-box; }
body { margin: 0; height: 100dvh; overflow: hidden; }
#app {
  --screen-ratio: .45;
  --shell-rim: 10px;
  --controls-height: 120px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  max-width: min(100%, calc((100dvh - var(--controls-height) - var(--shell-rim) * 2) * var(--screen-ratio) + var(--shell-rim) * 2 + 38px));
  height: 100%;
  margin: auto;
  padding: 14px;
  gap: 12px;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 24px; flex: none; padding: 0 2px; }
.device-label { display: flex; align-items: center; gap: 7px; min-width: 0; }
.header-actions { display: flex; align-items: center; gap: 8px; flex: none; }
#settings { display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: none; width: auto; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; }
#settings svg { width: 14px; height: 14px; flex: none; stroke-width: 1.6; }
#settings[data-enabled="true"] { color: var(--live); }
.device-label svg { width: 15px; height: 17px; flex: none; stroke: var(--muted); stroke-width: 1.5; }
#model { font-size: 12px; font-weight: 500; letter-spacing: .01em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#status { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; white-space: nowrap; }
#status i { width: 5px; height: 5px; background: #a5a5a8; border-radius: 50%; }
[data-state="live"] #status i { background: var(--live); }
[data-state="buffering"] #status i { background: var(--live); }
[data-state="paused"] #status i { background: #c69a46; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; container-type: size; }
#phone-shell {
  --shell-radius: clamp(24px, 10cqw, 36px);
  position: relative;
  flex: none;
  width: min(calc(100cqw - 10px), calc((100cqh - var(--shell-rim) * 2) * var(--screen-ratio) + var(--shell-rim) * 2));
  padding: calc(var(--shell-rim) - 1px);
  border: 1px solid #66696e;
  border-radius: var(--shell-radius);
  background: linear-gradient(145deg, #42454a, #17191c 32%, #292c30 72%, #101214);
  box-shadow: inset 1px 0 0 #ffffff38, inset -1px 0 0 #ffffff18, 0 2px 4px #00000018, 0 16px 36px -12px #00000030;
}
.side-key { position: absolute; right: -4px; width: 3px; border: 1px solid #66696e; border-left: 0; border-radius: 0 2px 2px 0; background: linear-gradient(90deg, #555960, #23262a); pointer-events: none; }
.volume-key { top: 18%; height: 12%; }
.power-key { top: 35%; height: 7%; }
.earpiece { position: absolute; top: 3px; left: 50%; width: 26px; height: 2px; transform: translateX(-50%); border-radius: 2px; background: #08090a; box-shadow: 0 1px 0 #ffffff18; pointer-events: none; }
#device { position: relative; width: 100%; aspect-ratio: var(--screen-ratio); overflow: hidden; border-radius: calc(var(--shell-radius) - var(--shell-rim)); background: #101011; box-shadow: 0 0 0 1px #000000c0; touch-action: none; }
#frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; user-select: none; }
[data-orientation="landscape"] .side-key { top: -4px; right: auto; height: 3px; border: 1px solid #66696e; border-bottom: 0; border-radius: 2px 2px 0 0; background: linear-gradient(#555960, #23262a); }
[data-orientation="landscape"] .volume-key { left: 18%; width: 12%; }
[data-orientation="landscape"] .power-key { left: 35%; width: 7%; }
[data-orientation="landscape"] .earpiece { top: 50%; left: 3px; width: 2px; height: 26px; transform: translateY(-50%); }
#frame:not([src]) { visibility: hidden; }
#overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #171719f0; color: #e7e7e9; text-align: center; padding: 24px; }
#overlay[hidden] { display: none; }
#overlay-text { font-size: 13px; font-weight: 500; }
#overlay-detail { font-size: 11px; color: #8e8e94; line-height: 1.6; }
#pointer { display: none; position: absolute; width: 20px; height: 20px; border: 1.5px solid #ffffffc9; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; background: #ffffff20; }
footer { display: flex; align-items: center; align-self: center; flex: none; gap: 2px; height: 44px; padding: 4px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: 0 2px 5px #00000003; }
button { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--foreground); cursor: pointer; transition: background .15s, opacity .15s; }
button svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
button:hover:not(:disabled) { background: var(--hover); }
button:focus-visible { outline: 2px solid #7a9fdf; outline-offset: 1px; }
button:active:not(:disabled) { background: var(--line); }
button:disabled { opacity: .28; cursor: default; }
.divider { height: 15px; width: 1px; background: var(--line); margin: 0 5px; }
#notice { position: absolute; z-index: 2; bottom: 72px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 40px); width: max-content; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--foreground); box-shadow: 0 4px 16px #0000000c; font-size: 11px; line-height: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#notice:empty { display: none; }
#jev-settings { width: min(360px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); padding: 22px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--foreground); box-shadow: 0 20px 80px #00000030; overflow: auto; }
#jev-settings::backdrop { background: #00000055; backdrop-filter: blur(3px); }
.settings-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.settings-heading h2 { margin: 0; font-size: 17px; font-weight: 600; }
#settings-close { width: 28px; height: 28px; flex: none; color: var(--muted); }
.settings-intro { margin: 8px 0 18px; font-size: 12px; line-height: 1.7; color: var(--muted); }
.settings-state { margin-bottom: 18px; padding: 10px 12px; border-radius: 10px; background: var(--hover); font-size: 12px; line-height: 1.6; }
#jev-form label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 500; }
#jev-key { display: block; width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--foreground); font: inherit; font-size: 13px; }
#jev-key:focus { outline: 2px solid #7a9fdf; outline-offset: 1px; }
.settings-hint { margin: 7px 0; color: var(--muted); font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
.settings-disclosure { margin: 16px 0 0; font-size: 11px; line-height: 1.7; color: var(--muted); }
#jev-message { min-height: 17px; margin: 10px 0; font-size: 11px; line-height: 1.6; color: var(--live); }
#jev-message[data-error="true"] { color: #c3554c; }
#jev-enable { width: 100%; height: 40px; background: var(--foreground); color: var(--surface); font-size: 12px; font-weight: 500; }
#jev-enable:hover:not(:disabled) { opacity: .86; background: var(--foreground); }
.settings-secondary { display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 8px; }
.settings-secondary button { width: auto; height: 32px; padding: 0 6px; color: var(--muted); font-size: 11px; }
button[hidden] { display: none; }
@media (prefers-color-scheme: dark) {
  :root { color: #d6d6d8; background: #19191b; --foreground: #d6d6d8; --muted: #77777e; --line: #363639; --surface: #242426; --hover: #333336; --live: #67b98a; }
  #phone-shell { border-color: #707379; box-shadow: inset 1px 0 0 #ffffff28, inset -1px 0 0 #ffffff10, 0 3px 6px #00000038, 0 18px 40px -12px #00000080; }
}
@media (max-height: 480px) {
  #app { --shell-rim: 8px; --controls-height: 92px; padding: 8px 14px; gap: 6px; }
  header { height: 20px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style></head>
<body><!--__MODE__--><main id="app" data-state="connecting">
<header><div class="device-label"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 5h4m-3 13.5h2"/></svg><span id="model">Android</span></div>
<div class="header-actions"><span id="status"><i></i><span id="status-text">连接中</span></span><button id="settings" title="Jev 设置" aria-label="Jev 设置"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg><span>Jev</span></button></div></header>
<section id="stage"><div id="phone-shell"><span class="side-key volume-key" aria-hidden="true"></span><span class="side-key power-key" aria-hidden="true"></span><span class="earpiece" aria-hidden="true"></span><div id="device"><img id="frame" alt="Android 实时屏幕" draggable="false"><div id="overlay"><span id="overlay-text">正在连接手机…</span><small id="overlay-detail">实时视频将在这里显示</small></div><div id="pointer"></div></div></div></section>
<div id="notice" role="status" aria-live="polite"></div>
<footer aria-label="设备控制">
<button id="back" title="返回" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
<button id="home" title="主屏幕" aria-label="主屏幕"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg></button>
<span class="divider" aria-hidden="true"></span>
<button id="copy" title="复制画面" aria-label="复制画面"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
<button id="refresh" title="重新连接" aria-label="重新连接"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 8a7.5 7.5 0 1 0 .5 7M19 3v5h-5"/></svg></button>
</footer>
</main>
<dialog id="jev-settings" aria-labelledby="settings-title">
<form id="jev-form">
<div class="settings-heading"><h2 id="settings-title">Jev 决策设置</h2><button id="settings-close" type="button" aria-label="关闭设置"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
<p class="settings-intro">让 Agent 委托 Jev 处理连续的界面决策。</p>
<div id="jev-state" class="settings-state" role="status">正在读取设置…</div>
<label for="jev-key">TypeSafe API Key</label>
<input id="jev-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="4096" placeholder="粘贴你的 API Key">
<p class="settings-hint">Key 保存在此电脑，保存后不再回显。</p>
<p id="jev-provider" class="settings-hint"></p>
<p class="settings-disclosure">启用后，任务目标与界面文字会发送给 TypeSafe。设置对新任务生效。</p>
<p id="jev-message" role="status" aria-live="polite"></p>
<button id="jev-enable" class="primary" type="submit" disabled>验证并启用</button>
<div class="settings-secondary"><button id="jev-test" type="button" disabled>测试连接</button><button id="jev-disable" type="button" hidden>停用</button><button id="jev-clear" type="button" hidden>移除本机 Key</button></div>
</form>
</dialog>
