name: Standalone runtimes

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'src/android_use/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/*runtime*'
      - 'scripts/frozen_entry.py'
      - '.github/workflows/runtime.yml'
      - 'docs/licenses/**'
      - 'docs/third-party-introduction.md'
      - 'ui/build.mjs'
      - 'tests/fixtures/runtime-sample.h264'
      - 'THIRD_PARTY_NOTICES.md'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13.7'
      - run: uv run --frozen python scripts/fetch_runtime_inputs.py --cache dist/runtime-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build-inputs
          path: dist/runtime-inputs/*
          retention-days: 7
  build:
    needs: inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        id: build-python
        with:
          python-version: '3.13.7'
      - uses: astral-sh/setup-uv@v6
      - name: Prepare Windows compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-gcc diffutils pkgconf
      - name: Expose Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msys = '${{ steps.msys2.outputs.msys2-location }}'
          (Join-Path $msys 'mingw64/bin') >> $env:GITHUB_PATH
          (Join-Path $msys 'usr/bin') >> $env:GITHUB_PATH
          "ANDROID_USE_BUILD_BASH=$(Join-Path $msys 'usr/bin/bash.exe')" >> $env:GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build-inputs
          path: dist/runtime-build
      - run: uv sync --frozen --python "${{ steps.build-python.outputs.python-path }}"
      - run: uv pip install -r scripts/runtime-build-requirements.txt
      - name: Build native runtime and Dim plugin
        run: uv run --no-sync python scripts/build_runtime.py
      - name: Build a distinct upgrade version in a disposable source tree
        run: uv run --no-sync python scripts/build_runtime_upgrade_fixture.py
      - name: Test install, upgrade, rollback and bundled tools
        run: uv run --no-sync python scripts/accept_runtime.py --archive dist/runtime/android-use-runtime-${{ matrix.platform }}.zip --upgrade-archive dist/runtime-upgrade/android-use-runtime-${{ matrix.platform }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            dist/runtime/*.zip
            dist/runtime/*SHA256SUMS
            dist/runtime/acceptance.json
          retention-days: 14
